phase_criteria:
  P0:
  - 四任务关闭证据完整
  - 当前提交 CI 绿色且负例能阻断
  - 锁定安装和 PostgreSQL 环境真实可运行
  - 现行资料与阶段 Gate 无歧义
  - 类型化证据、治理正反回归及 DA-01～05 本阶段责任处置完成
  P1:
  - 实体及作用域正反例通过
  - 知识时序与操作类型一致
  - 未决基础 Schema 决策已落实
  P2:
  - 短事务原子性 CAS 幂等 PostgreSQL 证据
  - 唯一根提交与完整收据
  - 快照重建和跨项目隔离
  P3:
  - 双 Anchor 版本化扩展和规则
  - 污染与合法语境对照
  - 无静默默认题材
  P4:
  - 双 Story Fixture 审定
  - 类型化 Contract 与 Canon/Genre 绑定
  - 章内候选协议和可读性自由边界
  P5:
  - Context 必需集合与预算失败正确
  - 真实 Provider 接缝证据与预算
  - UNKNOWN 和费用模型可追踪
  P6:
  - 编排抽取重试检查点产物完成
  - 测试 fixture 与生产权限隔离
  - Draft/accepted 分离；完整生产放行仍待 P7
  P7:
  - Q0–Q3 及聚合器和正式 Permit 集成
  - M4 单章真实完整闭环
  - 有限 Patch 与完整重验；M5 证据
  P8:
  - 双 Genre 十章运行
  - 故障恢复与检查器可查
  - 最小真人评阅与全成本
  - 最终证据聚合后完成 M6
  P9:
  - 双 Genre 三十章
  - 弧线承诺疲劳与 durable recovery
  - 独立样本/版本/全部尝试记录
  - 工程/阅读/人工/成本独立结论和继续投入决定已记录
  P10:
  - 多入口 Genesis 归一
  - Reference 与原创边界
  - 同一 Canon 写路径
  P11:
  - Corpus Gold Regression 分区
  - 真实盲评校准
  - 策略晋级有证据与回退
  P12:
  - 百章连续运行
  - 实际备份恢复与 release manifest
  - 长期债务和成本/人工贡献可查
  P13:
  - 进入前补充任务并完成阶段细化
  - 真实 Reader/Market 证据
  - 信号归因与政策晋级单独验证
  P14:
  - 进入前补充任务并完成阶段细化
  - 三百章及百万字演进实证
  - 长期恢复与叙事更新可验证
