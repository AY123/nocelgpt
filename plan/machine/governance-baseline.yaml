version: 1.2.0
change_policy: 最低义务的变更必须在 changes 中说明理由/影响并修订验证器中的批准摘要；--write-views 不会重建本文件。文件哈希不是防恶意仓库写权限的安全边界。
required_ci:
  STATIC:
    latest_activation_phase: P0
    required_checks:
    - format
    - lint
    - typecheck
    mode: every_change
  UNIT:
    latest_activation_phase: P0
    required_checks:
    - unit
    mode: every_change
  SCHEMA_CONTRACT:
    latest_activation_phase: P0
    required_checks:
    - plan validation
    - active schemas and contracts
    mode: every_change
  ARCH_FITNESS:
    latest_activation_phase: P0
    required_checks:
    - positive and negative boundary fixtures
    mode: every_change
  SECRET_DEPENDENCY:
    latest_activation_phase: P0
    required_checks:
    - secret scan
    - locked dependency scan
    mode: every_change
  POSTGRES_ENV:
    latest_activation_phase: P0
    required_checks:
    - real database connect and clean fixture
    mode: every_change
  CANON_CAS_IDEMPOTENCY:
    latest_activation_phase: P2
    required_checks:
    - atomic commit
    - CAS
    - same/different payload dedupe
    - rebuild
    mode: every_change
  DETERMINISTIC_E2E:
    latest_activation_phase: P7
    required_checks:
    - real Q0-Q3 permit commit integration
    mode: every_change
  GENRE_SMOKE:
    latest_activation_phase: P8
    required_checks:
    - dual-anchor smoke and negative controls
    mode: every_change
  LIVE_PROVIDER:
    latest_activation_phase: P5
    required_checks:
    - actual provider schema and error contract
    - budget and UNKNOWN
    mode: scheduled_protected_manual_release
