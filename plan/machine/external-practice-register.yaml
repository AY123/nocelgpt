practices:
- id: EXT-001
  title: 显式题材绑定与无匹配策略
  decision: REFINE_EXISTING
  status: PLANNED
  source_refs:
  - SRC-WEBNOVEL
  - SRC-WEBNOVEL-GENRE
  baseline_coverage: 已有 Pack 绑定和禁止静默 fallback，缺少子流派/策略无命中反例。
  local_adaptation: 区分 Pack 与可选策略；无命中不覆盖显式 Genre，也不自动塞入相近题材套路。
  expected_benefit: 降低路由与检索引入的题材污染；收益待认证。
  normative_refs:
