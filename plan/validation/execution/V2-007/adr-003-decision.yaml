rationale: 'ADR-003 establishes Event occurrence and Promise temporal semantics for
  V2-007 with critical corrections: (M1) Promise.status as pure derivation function
  without external store query, (M2) FULFILLED/FAILED/ABANDONED terminal exclusivity,
  (M3) IntervalTime OVERLAP/UNKNOWN semantics, (M4) planning order as presentation
  hint not canonical fact, (M5) schema artifacts deferred, (M6) verification examples
  within V2-007 pure-domain boundary, (M7) decision_record authority unified. Defines
  Event/Promise/PromiseFulfillmentLink/Timeline domain model, hard invariants vs soft
  policies separation, Canon ownership semantics (implementation in V2-009), idempotency
  requirements, non-linear narrative support. Rejects over-engineered alternatives.
  Preserves V2-005/V2-006/V2-061 authority boundaries. Ratifies finalized architecture
  decision; V2-007 implementation verification is separate.'
