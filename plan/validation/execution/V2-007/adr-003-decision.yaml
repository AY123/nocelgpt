rationale: ADR-003 establishes Event occurrence and Promise temporal semantics for V2-007
  Event Timeline Promise Core. Defines Event/Promise/PromiseFulfillmentLink/Timeline
  domain model, hard invariants vs soft policies separation, Canon ownership, idempotency
  guarantees, and support for non-linear narrative (flashbacks, story_time vs occurrence_chapter).
  Rejects over-engineered alternatives. Preserves V2-005/V2-006/V2-061 authority boundaries.
