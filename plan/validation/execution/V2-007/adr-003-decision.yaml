rationale: 'ADR-003 establishes Event occurrence and Promise temporal semantics for
  V2-007. Final corrections eliminate residual contradictions: terminal state mutual
  exclusivity (no FULFILLED↔FAILED/ABANDONED transitions), PromiseFulfillmentLink
  immutability enforcement, FAILED+PRIMARY test clarified as invalid-state defensive
  behavior, V2-007 uniqueness semantics vs V2-009 retry mechanism distinguished, Timeline.events
  partial-order wording (list position ≠ temporal truth), implementation guidance
  consolidated, test_v2_007.py non-replaceability explicit. Core semantics: (M1)
  Promise.status pure derivation, (M2) terminal exclusivity, (M3) IntervalTime OVERLAP/UNKNOWN,
  (M4) planning order as presentation hint, (M5) schema deferred, (M6) verification
  within V2-007 boundary, (M7) decision_record unified. Defines Event/Promise/PromiseFulfillmentLink/Timeline
  domain model, hard invariants vs soft policies, Canon ownership semantics (V2-009
  implementation), idempotency requirements, non-linear narrative support. Rejects
  over-engineered alternatives. Preserves V2-005/V2-006/V2-061 authority boundaries.
  Ratifies final internally-consistent architecture decision; V2-007 implementation
  verification is separate.'
