rationale: 'ADR-003 establishes Event occurrence and Promise temporal semantics for
  V2-007. Corrected: Promise status authority (terminal_disposition BASE, status DERIVED
  from Links), FAILED semantics clarification (world evidence vs narrative abandonment),
  V2-007 phase boundary (no CanonCommitService dependency), temporal partial order
  support, and Machine SSOT artifact path alignment. Defines Event/Promise/PromiseFulfillmentLink/Timeline
  domain model, hard invariants vs soft policies separation, Canon ownership semantics
  (implementation in V2-009), idempotency guarantees, and support for non-linear narrative.
  Rejects over-engineered alternatives. Preserves V2-005/V2-006/V2-061 authority
  boundaries. This ratifies the corrected architecture decision only; V2-007 implementation
  verification is separate.'
