review_notes:
- V2-061 is pure domain implementation with no external dependencies
- Character must use EntityId from V2-005 for entity_id field
- Proposition.context must be recursively deep-frozen (not mutable dict)
- CharacterKnowledge acquisition provenance is mandatory
- absence of occurrence evidence is not proof of non-occurrence
- PlannedAction occurrence link is not occurrence truth (V2-007 is authority)
- character.schema.json contains BASE fields only, no DERIVED, no CACHE
- Contract explicitly states this is knowledge modeling, not AI knowledge base
