rationale: |
  Evidence records originally referenced artifacts in docs/ which are mutable and
  editable. To ensure immutability and historical integrity, exact historical Git
  blobs were extracted and preserved in immutable evidence artifact storage.

  No SHA256 values were modified. All artifact content bytes are identical to
  historical Git state at specified report commits.

  This preserves evidence integrity while enabling schema_contract validation to
  pass without weakening validator rules or adding exception paths.

key_principle: |
  subject_revision (code/tests being evidenced) != report_commit (evidence artifact creation)
  This is correct and expected. Evidence artifacts may be created after subject execution,
  as long as artifact bytes, hashes, and lineage are authentically traceable.
