default:
  tags:
  - trusted-acceptance
  before_script:
  - "python -I -B - <<'ANOVELOS_TRUSTED_GUARD'\nimport base64\nimport hashlib\nimport json\nimport os\nfrom pathlib\
    \ import Path\nimport stat\nimport sys\nimport zlib\n\nEXPECTED_JSON_ZLIB_B64 = ''\n\
    SOURCE_ROOTS = (\"scripts\", \"plan\", \"tests\", \"src\")\nROOT_FILES = ('.gitignore', '.gitlab-ci.yml', '.gitleaks.toml',\
    \ '.python-version', 'AGENTS.md', 'pyproject.toml', 'uv.lock', 'security-policy.yaml', 'pytest.ini', '.pytest.ini',\
    \ 'setup.cfg', 'tox.ini', 'conftest.py', 'sitecustomize.py', 'usercustomize.py', '.coveragerc', '.gitattributes',\
    \ '.gitmodules', 'setup.py', 'uv.toml', 'pip.conf', 'pip.ini', '.pypirc')\nEXCLUSIONS = (\"plan/validation/execution/V2-004/enrollment-20261005/trusted-ci.yml\"\
    , \"plan/validation/execution/V2-004/enrollment-20261005/acceptance-overlay.yml\")\nAUXILIARY_MODULE_ROOTS =\
    \ (\"docs\",)\nOUTPUT_ROOTS = (\".git\", \"dist\", \".pytest_cache\")\nMODULE_SUFFIXES = (\".py\", \".pyc\"\
    , \".pyo\", \".pyw\", \".so\", \".pyd\")\n\n\ndef regular_digest(path):\n    mode = path.lstat().st_mode\n \
    \   if not stat.S_ISREG(mode):\n        raise ValueError(\"non-regular or symlink source file: \" + str(path))\n\
    \    return hashlib.sha256(path.read_bytes()).hexdigest()\n\n\ndef inventory(root):\n    result = {}\n    permitted_directories\
    \ = set(SOURCE_ROOTS + AUXILIARY_MODULE_ROOTS + OUTPUT_ROOTS)\n    for item in root.iterdir():\n        if item.is_symlink():\n\
    \            raise ValueError(\"symlink root entry: \" + item.name)\n        if item.is_dir():\n           \
    \ if item.name not in permitted_directories:\n                raise ValueError(\"unexpected root directory:\
    \ \" + item.name)\n            if item.name in OUTPUT_ROOTS and item.name != \".git\":\n                for\
    \ child in item.iterdir():\n                    if child.is_symlink() or child.name.lower().endswith(MODULE_SUFFIXES):\n\
    \                        raise ValueError(\"output root acquired importable module: \" + str(child.relative_to(root)))\n\
    \        elif item.name.lower().endswith(MODULE_SUFFIXES) and item.name not in ROOT_FILES:\n            raise\
    \ ValueError(\"unexpected root Python/extension module: \" + item.name)\n    for area in SOURCE_ROOTS:\n   \
    \     directory = root / area\n        if directory.is_symlink() or not directory.is_dir():\n            raise\
    \ ValueError(\"missing or symlink source root: \" + area)\n        for current, directories, files in os.walk(directory,\
    \ followlinks=False):\n            for name in directories:\n                item = Path(current) / name\n \
    \               if item.is_symlink() or not item.is_dir():\n                    raise ValueError(\"non-directory\
    \ or symlink source directory: \" + str(item))\n            for name in files:\n                item = Path(current)\
    \ / name\n                relative = item.relative_to(root).as_posix()\n                mode = item.lstat().st_mode\n\
    \                if not stat.S_ISREG(mode):\n                    raise ValueError(\"non-regular or symlink source\
    \ file: \" + relative)\n                if relative not in EXCLUSIONS:\n                    result[relative]\
    \ = regular_digest(item)\n    for area in AUXILIARY_MODULE_ROOTS:\n        directory = root / area\n       \
    \ if not directory.exists():\n            continue\n        for current, directories, files in os.walk(directory,\
    \ followlinks=False):\n            for name in directories:\n                item = Path(current) / name\n \
    \               if item.is_symlink() or not item.is_dir():\n                    raise ValueError(\"non-directory\
    \ or symlink auxiliary directory: \" + str(item))\n            for name in files:\n                item = Path(current)\
    \ / name\n                if item.is_symlink():\n                    raise ValueError(\"symlink auxiliary source\
    \ file: \" + str(item))\n                if name.lower().endswith(MODULE_SUFFIXES):\n                    result[item.relative_to(root).as_posix()]\
    \ = regular_digest(item)\n    for name in ROOT_FILES:\n        item = root / name\n        if item.exists()\
    \ or item.is_symlink():\n            result[name] = regular_digest(item)\n    return result\n\n\ndef main():\n\
    \    try:\n        if (os.environ.get(\"CI_PROJECT_ID\") != \"86656946\"\n                or os.environ.get(\"\
    CI_COMMIT_BRANCH\") != \"acceptance/v2-004\"\n                or os.environ.get(\"CI_COMMIT_REF_PROTECTED\"\
    ) != \"true\"):\n            raise ValueError(\"wrong or missing protected acceptance context\")\n        for\
    \ entry in ('.venv', 'uv.toml', 'pip.conf', 'pip.ini', '.pip', '.uv', '.pypirc'):\n            if os.path.lexists(Path.cwd()\
    \ / entry):\n                raise ValueError(\"preexisting installation environment/configuration: \" + entry)\n\
    \        expected = json.loads(zlib.decompress(base64.b64decode(EXPECTED_JSON_ZLIB_B64, validate=True)))\n \
    \       if (not isinstance(expected, dict)\n                or set(expected) != {\"record_type\", \"schema_version\"\
    , \"source_roots\", \"root_files\", \"self_exclusions\", \"files\"}\n                or expected[\"record_type\"\
    ] != \"protected_source_integrity_manifest\"\n                or expected[\"schema_version\"] != \"1.0\"\n \
    \               or expected[\"source_roots\"] != list(SOURCE_ROOTS)\n                or expected[\"root_files\"\
    ] != list(ROOT_FILES)\n                or expected[\"self_exclusions\"] != list(EXCLUSIONS)\n              \
    \  or not isinstance(expected[\"files\"], dict)\n                or not expected[\"files\"]):\n            raise\
    \ ValueError(\"malformed protected-source inventory\")\n        required = expected[\"files\"]\n        for\
    \ name, digest in required.items():\n            if (not isinstance(name, str) or not name or name in EXCLUSIONS\n\
    \                    or not (name in ROOT_FILES or any(name.startswith(area + \"/\") for area in SOURCE_ROOTS)\
    \ or (any(name.startswith(area + \"/\") for area in AUXILIARY_MODULE_ROOTS) and name.lower().endswith(MODULE_SUFFIXES)))\n\
    \                    or name.startswith(\"/\") or any(part in {\"\", \".\", \"..\"} for part in name.split(\"\
    /\"))\n                    or not isinstance(digest, str) or len(digest) != 64\n                    or any(char\
    \ not in \"0123456789abcdef\" for char in digest)):\n                raise ValueError(\"malformed protected-source\
    \ file identity\")\n        if (not {\".gitlab-ci.yml\", \"pyproject.toml\", \"uv.lock\", \"security-policy.yaml\"\
    }.issubset(required)\n                or any(not any(name.startswith(area + \"/\") for name in required) for\
    \ area in SOURCE_ROOTS)):\n            raise ValueError(\"incomplete protected-source inventory\")\n       \
    \ actual = inventory(Path.cwd())\n        missing = sorted(set(required) - set(actual))\n        extra = sorted(set(actual)\
    \ - set(required))\n        changed = sorted(name for name in set(required) & set(actual) if required[name]\
    \ != actual[name])\n        if missing or extra or changed:\n            print(json.dumps({\"status\": \"FAIL\"\
    , \"missing\": missing, \"extra\": extra, \"changed\": changed}), file=sys.stderr)\n            return 1\n \
    \       print(json.dumps({\"status\": \"PASS\", \"checked_files\": len(actual), \"self_exclusions\": list(EXCLUSIONS)}))\n\
    \        return 0\n    except (OSError, ValueError, TypeError, KeyError, UnicodeError, zlib.error) as error:\n\
    \        print(json.dumps({\"status\": \"FAIL\", \"reason\": str(error)}), file=sys.stderr)\n        return\
    \ 1\n\n\nraise SystemExit(main())\nANOVELOS_TRUSTED_GUARD"
  - python -m pip install --index-url https://pypi.org/simple uv==0.12.17
  - uv --version
  - uv sync --locked
