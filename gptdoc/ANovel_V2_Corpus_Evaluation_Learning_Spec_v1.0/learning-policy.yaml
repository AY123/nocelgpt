document_id: SPEC-LEARNING-0001-POLICY
version: 1.0.0
truth_layers:
  production_truth:
  - workflow
  - canon
  - lineage
  - telemetry
  human_truth:
  - human_blind_review
  - expert_review
  market_truth:
  - reader_signal
  - subscription
  - revenue
  - ranking
hard_rules:
- id: LEARN-POL-001
  rule: ai_provisional_cannot_become_human_gold_automatically
- id: LEARN-POL-002
  rule: holdout_not_used_for_tuning
- id: LEARN-POL-003
  rule: frozen_experiment_immutable
- id: LEARN-POL-004
  rule: learning_event_cannot_mutate_canon
- id: LEARN-POL-005
  rule: market_signal_requires_exposure_context
- id: LEARN-POL-006
  rule: promotion_requires_predefined_guardrails
- id: LEARN-POL-007
  rule: private_or_restricted_corpus_cannot_enter_public_reuse
- id: LEARN-POL-008
  rule: failed_experiment_must_be_retained
promotion_sequence:
- PROPOSAL
- BENCHMARK
- VALIDATION
- HOLDOUT
- SHADOW
- PROMOTION
forbidden_auto_changes:
- PROJECT_CONSTITUTION
- CANON_HISTORY
- GENRE_HARD_SEMANTICS
- HUMAN_AUTHORITY_RULES
- SECURITY_RULES
- ORIGINALITY_BOUNDARY
