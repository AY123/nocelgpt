document_id: SPEC-PLAN-0001-POLICY
version: 1.0.0
defaults:
  planning_levels:
  - series
  - macro_arc
  - volume
  - arc
  - chapter
  - scene
  freeze_horizon:
    chapters: 1
    scenes: 3
  chapter_commit_boundary: true
  scene_contract_execution_boundary: true
  missing_contract: BLOCK
  stale_contract: BLOCK
  future_plan_mutable: true
  committed_canon_mutable: false
rules:
- id: PLAN-POL-001
  rule: canon_over_plan
  severity: hard
- id: PLAN-POL-002
  rule: contract_compiled_not_hardcoded
  severity: hard
- id: PLAN-POL-003
  rule: required_transition_machine_readable
  severity: hard
- id: PLAN-POL-004
  rule: knowledge_boundary_compiled_from_canon
  severity: hard
- id: PLAN-POL-005
  rule: plan_change_invalidates_dependents
  severity: hard
- id: PLAN-POL-006
  rule: far_future_abstract_near_future_concrete
  severity: strong
