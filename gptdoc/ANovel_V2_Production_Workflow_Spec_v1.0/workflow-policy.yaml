document_id: SPEC-WORKFLOW-0001-POLICY
version: 1.0.0
production_rules:
- id: WF-POL-001
  rule: single_authoritative_workflow
  severity: hard
- id: WF-POL-002
  rule: workflow_state_not_canon_state
  severity: hard
- id: WF-POL-003
  rule: irreversible_side_effects_idempotent
  severity: hard
- id: WF-POL-004
  rule: resume_from_durable_checkpoint
  severity: hard
- id: WF-POL-005
  rule: stage_graph_drives_execution
  severity: hard
- id: WF-POL-006
  rule: semantic_model_key_excludes_operational_fields
  severity: hard
- id: WF-POL-007
  rule: publish_separate_from_commit
  severity: hard
- id: WF-POL-008
  rule: no_silent_failure
  severity: hard
failure_classes:
- TRANSIENT
- PERMANENT
- SEMANTIC_INVALID
- POLICY_BLOCKED
- BUDGET_BLOCKED
- CONCURRENCY_CONFLICT
- HUMAN_REQUIRED
- CANCELLED
