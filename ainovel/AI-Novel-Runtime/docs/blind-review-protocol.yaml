## 七、评分表单模板

### 文件: `forms/blind-review-template.yaml`

```yaml
blind_review_form:
  version: "1.0"
  batch: "G1"
  editor_id: "editor-A"
  date: "2026-09-XX"

  # 基本信息
  reading_time_minutes: 45
  reading_device: "手机/电脑/平板"
  reading_environment: "安静/嘈杂"

  # 5维度评分（1-5分，可用小数）
  scores:
    opening_hook: 4.0
    character: 3.5
    continuity: 4.0
    naturalness: 2.5
    commercial: 3.5

  # 整体可发布性
  overall_verdict: "小修后发布"  # 可直接发布/小修后发布/大修后发布/不可发布

  # 具体问题记录（必须≥3条）
  issues:
    - chapter: 1
      location: "开篇前300字"
      problem: "信息堆砌，节奏略慢"
      severity: "low"
      suggestion: "可压缩到200字"

    - chapter: 2
      location: "中段，约第500-800字"
      problem: "连续3句同头排比：'他知道...他知道...他知道...'"
      severity: "medium"
      suggestion: "改写至少2句的开头"

    - chapter: 3
      location: "末尾决策场景"
      problem: "主角突然决定冒险，动机不够充分"
      severity: "medium"
      suggestion: "增加内心戏，解释为什么必须冒险"

  # 亮点记录（可选，至少1条）
  highlights:
    - chapter: 1
      location: "晶矿城初见"
      strength: "世界观细节丰富，有画面感"

    - chapter: 2
      location: "与守卫的对话"
      strength: "对话自然，有张力"

  # 总体评价（100-200字）
  summary: |
    这是一部有潜力的玄幻小说开篇。世界观设定有新意，主角性格基本立住。
    主要问题是部分段落有明显的AI生成痕迹（同头排比、模板表达），
    以及个别情节动机不够充分。如果能修复这些问题，达到小说网站上架标准。

  # 商业判断（是否愿意付费）
  willingness_to_pay:
    would_subscribe: true  # 是否愿意订阅
    expected_price: "5元/千字"  # 可接受的定价
    drop_risk: "medium"  # 弃读风险（low/medium/high）
    reason: "有爽点，但AI味可能影响长期留存"
```

