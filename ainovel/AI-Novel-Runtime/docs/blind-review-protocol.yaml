# 人工盲评协议（Blind Review Protocol）

**版本**: 1.0
**制定日期**: 2026-08-21
**适用范围**: ANovel Phase 1 黄金三章 + 前10章质量验收
**负责人**: 项目团队 + 2名独立编辑

---

## 一、协议目标

建立系统性、可重复的人工质量验收流程，确保AI生成小说达到"可发布"标准。

### 核心原则

1. **双盲独立**: 两位编辑独立评审，互不知晓对方意见
2. **去AI偏见**: 移除所有元数据，评审者不知道是AI生成
3. **量化标准**: 使用5分制量化评分 + 具体问题记录
4. **可验证性**: 所有评审记录归档，可追溯

---

## 二、评审范围

### Phase 1 评审计划

| 批次 | 范围 | 目的 | 时间 |
|------|------|------|------|
| **G1（黄金三章）** | 第1-3章 | 验证开篇质量 | Week 4-5 |
| **G10（前十章）** | 第1-10章 | 验证持续质量 | Week 5-6 |
| **G30（可选）** | 第1-30章 | 验证长篇稳定性 | Week 6+ |

### 本协议覆盖

- ✅ G1: 黄金三章（必须）
- ✅ G10: 前十章（必须）
- 🟡 G30: 视G1/G10结果决定

---

## 三、编辑资格要求

### 必备条件

| 要求 | 标准 |
|------|------|
| **经验** | 网文编辑/作者经验 ≥3年 |
| **题材** | 熟悉玄幻/升级流题材 |
| **平台** | 熟悉起点/番茄等主流平台 |
| **语言** | 中文母语者 |
| **可用性** | 能在1周内完成评审 |

### 优先条件

- ✅ 有起点签约编辑经验
- ✅ 有实际上架作品经验
- ✅ 熟悉AI生成内容特征（能识别AI味）

### 回避条件

- ❌ 不能是项目团队成员
- ❌ 不能相互认识（编辑A和编辑B）
- ❌ 不能事先了解本项目细节

---

## 四、评分维度（5维度 × 5分制）

### 维度1：开篇吸引力 (Opening Hook)

**评分标准**:
- **5分**: 前300字立刻抓住读者，强烈想看下去
- **4分**: 开篇有吸引力，愿意继续阅读
- **3分**: 开篇中规中矩，不反感但不兴奋
- **2分**: 开篇平淡，需要强迫自己看下去
- **1分**: 开篇无聊/混乱，不想继续读

**评价要点**:
- 前300字是否有冲突/悬念/新鲜感？
- 是否快速建立代入感？
- 是否让读者产生"接下来会怎样"的好奇？

---

### 维度2：人物可信度 (Character Credibility)

**评分标准**:
- **5分**: 角色言行完全可信，有血有肉
- **4分**: 角色基本可信，偶有小瑕疵
- **3分**: 角色可接受，但有明显模板化倾向
- **2分**: 角色行为不合理，或严重OOC
- **1分**: 角色像提线木偶，完全不可信

**评价要点**:
- 主角决策是否符合人物设定？
- 对话是否自然，有无"背台词感"？
- 角色情绪变化是否合理？
- 有无明显的"为剧情服务"的违和行为？

---

### 维度3：剧情连贯性 (Plot Continuity)

**评分标准**:
- **5分**: 情节流畅，逻辑严密，无断裂
- **4分**: 情节基本连贯，有少量小跳跃
- **3分**: 情节可跟随，但有明显跳跃或逻辑漏洞
- **2分**: 情节断裂明显，难以理解因果
- **1分**: 情节混乱，前后矛盾

**评价要点**:
- 事件推进是否自然？
- 有无突兀的情节跳转？
- 有无未交代的前因后果？
- 跨章节是否有断裂感？

---

### 维度4：文本自然度 (Text Naturalness)

**评分标准**:
- **5分**: 语言完全自然，无AI味，像人类作者写的
- **4分**: 语言基本自然，偶有AI痕迹但不明显
- **3分**: 有明显AI味（排比/模板表达），但可接受
- **2分**: AI味严重，阅读体验受损
- **1分**: 机械生硬，明显是机器生成

**AI味常见表现**（评审者参考）:
- ❌ 连续同头排比："他知道...他知道...他知道..."
- ❌ 高频模板："深吸一口气""眼中闪过一丝""嘴角勾起"
- ❌ 过度修辞："如同...一般""仿佛...似的"
- ❌ 机械化节奏：句子长度过于均匀

**评价要点**:
- 是否有上述AI味表现？
- 语言是否精炼，有无注水感？
- 是否有明显的"模板拼接"痕迹？

---

### 维度5：商业潜力 (Commercial Potential)

**评分标准**:
- **5分**: 强烈想继续看，愿意付费订阅
- **4分**: 有看下去的欲望，可能会付费
- **3分**: 可以看但不强烈，付费意愿弱
- **2分**: 勉强能看完，不会付费
- **1分**: 不想继续看，完全无付费意愿

**评价要点**:
- 是否有"爽点"或"情绪价值"？
- 是否有想知道"接下来怎样"的欲望？
- 章末钩子是否有效？
- 如果在起点/番茄看到，是否会订阅？

---

## 五、整体可发布性判断

### 判断标准（4级）

| 等级 | 标准 | 操作 |
|------|------|------|
| **A. 可直接发布** | 5个维度均≥4分，无重大缺陷 | 通过，进入下一阶段 |
| **B. 小修后发布** | 5个维度均≥3分，有少量问题但可快速修复 | 记录问题，修复后通过 |
| **C. 大修后发布** | 有1-2个维度<3分，需要较大改动 | 返工，重新评审 |
| **D. 不可发布** | 有≥3个维度<3分，或有任一维度=1分 | 失败，需重新生成 |

### 关键红线（一票否决）

- ❌ **文本断裂**: 有跨章句子分裂、词内标点等硬伤
- ❌ **逻辑崩溃**: 主线剧情自相矛盾
- ❌ **角色崩坏**: 主角OOC严重（人设完全不一致）
- ❌ **抄袭风险**: 明显与已知作品雷同

**如果触发红线，直接判定"D. 不可发布"，无论评分多高。**

