## 十、风险与缓解

| 风险 | 概率 | 影响 | 缓解措施 |
|------|------|------|---------|
| 编辑识别出是AI生成 | 中 | 中 | 移除所有AI痕迹，使用自然格式 |
| 两位编辑意见差异巨大 | 中 | 中 | 设计仲裁流程，取中位数 |
| 编辑拖延不交付 | 低 | 高 | 预付50%，约定交付期限 |
| 评审质量不高（敷衍） | 低 | 高 | 筛选资深编辑，验收评审详细度 |

