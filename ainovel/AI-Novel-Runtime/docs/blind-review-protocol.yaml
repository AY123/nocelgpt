## 六、评审流程（7步）

### Step 1: 准备盲评样本

**责任人**: 项目团队

**操作**:
```bash
# 生成盲评样本（移除所有元数据）
python3 -m runtime.cli blind-review prepare \
  --project novel-lingse \
  --chapters 1-3 \
  --output blind-samples/G1-lingse-ch1-3.txt \
  --strip-metadata
```

**样本要求**:
- ✅ 纯文本格式（.txt或.md）
- ✅ 移除所有AI标记（无"由AI生成"字样）
- ✅ 移除运行记录、评分、元数据
- ✅ 保留章节标题和正文
- ✅ 统一格式（避免格式差异暴露来源）

---

### Step 2: 发送给编辑A（独立评审）

**责任人**: 项目团队

**发送内容**:
1. 盲评样本文件
2. 评分表单（Google Form或本地YAML模板）
3. 评审指引（本协议的简化版）

**说明**:
- 告知：这是一部玄幻小说的前几章
- 不告知：是AI生成、项目背景、评审目的
- 要求：1周内完成，记录阅读时间

**评分表单**: `forms/G1-editor-A-form.yaml`

---

### Step 3: 发送给编辑B（独立评审）

**责任人**: 项目团队

**操作**: 与Step 2相同，但发送给编辑B

**独立性保证**:
- 编辑A和编辑B不相互知晓
- 同时发送（避免时间差泄露信息）
- 使用不同联系方式（避免交叉）

---

### Step 4: 收集评审结果

**责任人**: 项目团队

**产物**:
- `reviews/G1-editor-A.yaml` - 编辑A的评审结果
- `reviews/G1-editor-B.yaml` - 编辑B的评审结果

**验收检查**:
- ✅ 5个维度评分齐全
- ✅ 整体可发布性判断明确
- ✅ 具体问题记录详细（至少3-5条）
- ✅ 阅读时间记录

---

### Step 5: 对比一致性

**责任人**: 项目团队

**操作**:
```bash
python3 -m runtime.cli blind-review compare \
  --review-a reviews/G1-editor-A.yaml \
  --review-b reviews/G1-editor-B.yaml \
  --output reviews/G1-consensus.yaml
```

**一致性指标**:
- **高一致**: 5个维度差异均≤1分 → 可信度高
- **中一致**: 3-4个维度差异≤1分 → 可信度中
- **低一致**: ≥3个维度差异>1分 → 需要仲裁

**示例输出**:
```yaml
consistency:
  opening_hook: 0.5  # 编辑A=4, 编辑B=4.5, diff=0.5
  character: 1.0     # 编辑A=3, 编辑B=4, diff=1.0
  continuity: 0.0    # 编辑A=4, 编辑B=4, diff=0.0
  naturalness: 2.0   # 编辑A=2, 编辑B=4, diff=2.0 ⚠️分歧
  commercial: 0.5
  overall: "medium"  # 4/5维度一致

divergence:
  - dimension: naturalness
    editor_a: 2
    editor_b: 4
    reason: "AI味判断主观性强"
    action: "需要仲裁"
```

---

### Step 6: 分歧仲裁

**责任人**: 资深编辑/用户本人

**触发条件**:
- 任一维度差异≥2分
- 整体可发布性判断不一致（A说"可发布"，B说"不可发布"）

**仲裁流程**:
1. 重新盲读该章节
2. 理解双方分歧点
3. 给出第三方判断
4. 记录仲裁理由

**仲裁规则**:
- 对于质量判断（维度1-5）：取三方的**中位数**
- 对于可发布性：遵循**保守原则**（有一人说"不可发布"→需慎重）

---

### Step 7: 生成共识报告

**责任人**: 项目团队

**产物**: `reviews/G1-consensus.yaml`

**内容**:
```yaml
consensus_report:
  batch: "G1"
  chapters: [1, 2, 3]
  date: "2026-09-XX"

  editors:
    - id: "editor-A"
      qualification: "起点签约编辑，5年经验"
    - id: "editor-B"
      qualification: "网文作者，10万字作品3部"

  scores:
    opening_hook:
      editor_a: 4.0
      editor_b: 4.5
      consensus: 4.25
    character:
      editor_a: 3.0
      editor_b: 4.0
      consensus: 3.5
    continuity:
      editor_a: 4.0
      editor_b: 4.0
      consensus: 4.0
    naturalness:
      editor_a: 2.0
      editor_b: 4.0
      arbitrated: 3.0  # 仲裁结果
    commercial:
      editor_a: 3.5
      editor_b: 4.0
      consensus: 3.75

  overall_verdict:
    editor_a: "小修后发布"
    editor_b: "小修后发布"
    consensus: "小修后发布"

  key_issues:
    - issue: "第2章AI味明显（连续同头排比×3处）"
      severity: "medium"
      mentioned_by: ["editor_a"]
    - issue: "第1章开篇略慢，前500字可压缩"
      severity: "low"
      mentioned_by: ["editor_a", "editor_b"]
    - issue: "第3章主角决策动机不够充分"
      severity: "medium"
      mentioned_by: ["editor_b"]

  action_items:
    - "修复第2章AI味（3处同头排比）"
    - "压缩第1章开篇（前500字）"
    - "补充第3章主角决策动机（增加内心戏）"

  phase1_pass: true  # 通过Phase 1验收
```

