id: "QRL-00001"
kind: "quality_rubric"
version: "1.0"
title: "中文商业网文质量 Rubric"
scope: "chapter"
audience: "editorial_review"
scoring_scale: "0-100"
dimensions:
  - id: "opening_hook"
    label: "开篇抓力"
    weight: 0.12
    description: "开篇是否迅速建立吸引力、信息缺口和阅读动机。"
    signals:
      - "开场是否立住"
      - "前 300-800 字是否有钩子"
      - "是否有明确阅读承诺"
  - id: "chapter_goal"
    label: "章节目标"
    weight: 0.09
    description: "本章是否有明确可验证的目标，并在章节内持续推进。"
    signals:
      - "目标是否具体"
      - "是否有目标偏移"
      - "是否有结果闭环"
  - id: "conflict_progression"
    label: "冲突推进"
    weight: 0.11
    description: "冲突是否层层升级、是否推动情节发生变化。"
    signals:
      - "冲突是否具体"
      - "升级是否自然"
      - "是否存在原地打转"
  - id: "character_motivation"
    label: "人物动机"
    weight: 0.10
    description: "人物行为是否有内在动机支撑，是否可信。"
    signals:
      - "动机是否清晰"
      - "选择是否合乎性格"
      - "行为后果是否一致"
  - id: "emotion_flow"
    label: "情绪推进"
    weight: 0.08
    description: "情绪曲线是否连贯，是否能持续带动读者代入。"
    signals:
      - "情绪是否有起伏"
      - "情绪是否断层"
      - "是否存在情绪空转"
  - id: "information_density"
    label: "信息密度"
    weight: 0.08
    description: "章节信息是否有效，是否存在注水或重复说明。"
    signals:
      - "有效信息量"
      - "重复率"
      - "叙述是否拖沓"
  - id: "payoff_delivery"
    label: "爽点兑现"
    weight: 0.13
    description: "章节是否兑现前文承诺的爽点、反转或情绪回报。"
    signals:
      - "承诺是否兑现"
      - "爽点是否足量"
      - "回报是否对等"
  - id: "ending_hook"
    label: "章末钩子"
    weight: 0.10
    description: "章末是否形成强继续阅读动机。"
    signals:
      - "是否有未完待续"
      - "悬念是否自然"
      - "是否推进下章目标"
  - id: "continuity"
    label: "连续性"
    weight: 0.09
    description: "人物、设定、时间线和事件因果是否稳定一致。"
    signals:
      - "是否自相矛盾"
      - "是否吃设定"
      - "是否破坏时间线"
  - id: "ai_voice_risk"
    label: "AI 腔风险"
    weight: 0.05
    description: "是否存在模板味、空话、泛化句式和机械拼接感。"
    signals:
      - "是否过度概括"
      - "是否句式雷同"
      - "是否缺少具体细节"
  - id: "paying_intent"
    label: "付费意愿"
    weight: 0.03
    description: "章节是否强化读者愿意付费/追订的动机。"
    signals:
      - "是否有付费预期"
      - "是否强化下文价值"
      - "是否形成继续付费理由"
  - id: "continue_intent"
    label: "追读意愿"
    weight: 0.02
    description: "读者是否想立即点开下一章。"
    signals:
      - "是否想继续读"
      - "是否有情节惯性"
      - "是否存在中断点"
review_policy:
  authoritative: "human_editor"
  llm_use: "advisory_only"
  blocking: false
  rerun_required_on_prompt_change: true
  golden_set_required: true
