# timeline.idl.yaml — Timeline entity (TML)
# Authoritative source. Hand-edited. Facts only (ADR-006).
# A Timeline is a named time axis. Events (EVT) are positioned onto a Timeline.
idl_version: "1.0"
entity: Timeline
type_code: TML
description: "A named time axis onto which events are placed."
registry:
  facts_dir: timelines
  scope: project
  order: 1


fields:
  kind:
    type: enum
    enum_ref: timeline_kind
    required: true
    doc: "role of this axis (main / flashback / parallel / hypothetical)"

  calendar:
    type: string
    doc: "name of the in-world calendar system this axis uses"

  parent_timeline:
    type: ref
    ref_types: [TML]
    doc: "axis this one branches from, for flashback/parallel lines"

  branch_point:
    type: ref
    ref_types: [EVT]
    doc: "event on the parent axis where this axis diverges"

  ordering:
    type: enum
    values: [absolute, relative]
    default: absolute
    doc: "absolute = dated; relative = ordered only by sequence"

  notes:
    type: text
    doc: "free-text authoring notes; not a resolution source"
