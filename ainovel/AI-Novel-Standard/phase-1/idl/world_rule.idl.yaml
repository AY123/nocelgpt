# world_rule.idl.yaml — World-Rule element (MAG / TEC)
# Authoritative source. Hand-edited. Facts only (ADR-006).
# One entity covers both magic and technology rule-system elements; the
# `rule_kind` field distinguishes them. type_code is MAG by default; a TEC-coded
# instance uses the same shape (the generator emits a pattern accepting both).
idl_version: "1.0"
entity: WorldRule
type_code: MAG
also_type_codes: [TEC]
description: "A unit of the world's rule system (magic, technology, or law)."
registry:
  facts_dir: world_rules
  scope: project
  order: 5


fields:
  rule_kind:
    type: enum
    enum_ref: rule_kind
    required: true
    doc: "magic / technology / natural_law / social_law"

  statement:
    type: text
    required: true
    doc: "the rule as a declarative, testable statement"

  constraints:
    type: list
    of: { type: text }
    doc: "hard limits / costs / preconditions of the rule"

  enables:
    type: ref[]
    ref_types: [MAG, TEC]
    doc: "other rule elements this one makes possible"

  requires:
    type: ref[]
    ref_types: [MAG, TEC, ITM]
    doc: "prerequisites for this rule to apply"

  known_by:
    type: ref[]
    ref_types: [CHR, FAC]
    doc: "who canonically commands this rule"

  invariant_links:
    type: ref[]
    ref_types: [INV]
    doc: "canon invariants asserting this rule's hard limits (for QA)"

  certainty:
    type: enum
    enum_ref: certainty
    default: canon

  notes:
    type: text
    doc: "free-text authoring notes; not a resolution source"
