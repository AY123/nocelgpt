# relationship.idl.yaml — Relationship entity (REL)
# Authoritative source. Hand-edited. Facts only (ADR-006).
# A Relationship is a first-class entity (a typed, directed edge) so it can be
# referenced, versioned, and tombstoned like any other fact.
idl_version: "1.0"
entity: Relationship
type_code: REL
description: "A typed, directed relationship between two entities."
registry:
  facts_dir: relationships
  scope: project
  order: 4


fields:
  from:
    type: ref
    ref_types: [CHR, FAC]
    required: true
    doc: "source endpoint of the directed edge"

  to:
    type: ref
    ref_types: [CHR, FAC]
    required: true
    doc: "target endpoint of the directed edge"

  kind:
    type: enum
    enum_ref: relationship_kind
    required: true

  label:
    type: string
    doc: "specific role, e.g. 'younger brother', 'sworn enemy'"

  symmetric:
    type: bool
    default: false
    doc: "true if the relation holds equally in both directions"

  since_event:
    type: ref
    ref_types: [EVT]
    doc: "event at which this relationship began, if established"

  until_event:
    type: ref
    ref_types: [EVT]
    doc: "event at which this relationship ended, if any"

  certainty:
    type: enum
    enum_ref: certainty
    default: canon

  notes:
    type: text
    doc: "free-text authoring notes; not a resolution source"
