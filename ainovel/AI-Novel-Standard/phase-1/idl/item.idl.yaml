# item.idl.yaml — Item entity (ITM)
# Authoritative source. Hand-edited. Facts only (ADR-006).
idl_version: "1.0"
entity: Item
type_code: ITM
description: "A physical or conceptual object that exists in the story world."
registry:
  facts_dir: items
  scope: project
  order: 6


fields:
  category:
    type: string
    doc: "free classification, e.g. 'weapon', 'artifact', 'document'"

  owner:
    type: ref
    ref_types: [CHR, FAC]
    doc: "current canonical owner, if any"

  origin_event:
    type: ref
    ref_types: [EVT]
    doc: "event where the item was created/acquired, if established"

  location:
    type: ref
    ref_types: [LOC]
    doc: "where the item canonically resides"

  grants_rules:
    type: ref[]
    ref_types: [MAG, TEC]
    doc: "world-rule elements this item enables for its user"

  properties:
    type: map
    of: { type: string }
    doc: "declared properties as key->value facts"

  certainty:
    type: enum
    enum_ref: certainty
    default: canon

  notes:
    type: text
    doc: "free-text authoring notes; not a resolution source"
