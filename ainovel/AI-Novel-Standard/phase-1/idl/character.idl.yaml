# character.idl.yaml — Character entity (CHR)
# Authoritative source. Hand-edited. Facts only (ADR-006).
idl_version: "1.0"
entity: Character
type_code: CHR
description: "A person or agent that exists in the story world."
registry:
  facts_dir: characters     # registry/facts/<facts_dir>/<ID>.yaml
  scope: project            # project | standard
  order: 3


fields:
  # id, name, status, fact_version are injected universally (see spec §4.2).

  aliases:
    type: list
    of: { type: string }
    doc: "other names the character is known by; labels only, not IDs"

  importance:
    type: enum
    enum_ref: importance
    doc: "narrative weight of this character"

  certainty:
    type: enum
    enum_ref: certainty
    default: canon

  birth_event:
    type: ref
    ref_types: [EVT]
    doc: "event marking birth/origin, if established"

  age_facts:
    type: list
    of:
      type: struct
      fields:
        at_event: { type: ref, ref_types: [EVT], required: true, doc: "reference point" }
        age: { type: int, min: 0, required: true }
    doc: "asserted age AT specific events; never a derived 'is adult' inference"

  affiliations:
    type: ref[]
    ref_types: [FAC]
    doc: "factions/organizations the character belongs to"

  locations_known:
    type: ref[]
    ref_types: [LOC]
    doc: "locations canonically associated with the character"

  abilities:
    type: ref[]
    ref_types: [MAG, TEC]
    doc: "world-rule elements the character can use (declared, not inferred)"

  possessions:
    type: ref[]
    ref_types: [ITM]
    doc: "items the character canonically holds"

  arcs:
    type: ref[]
    ref_types: [ARC]
    doc: "character/plot arcs this character participates in"

  physical_facts:
    type: map
    of: { type: string }
    doc: "declared physical attributes as key->value facts (e.g. eye_color: green)"

  notes:
    type: text
    doc: "free-text authoring notes; not a resolution source"
