# _types.idl.yaml — shared type vocabulary (ANES v2 Phase 1)
# Authoritative source. Hand-edited. Governs the type system referenced by all
# entity IDL files. See spec/03-core-idl.md.
idl_version: "1.0"
shared: true

# Reusable enums shared across entities. Entity files reference these by name
# via `enum_ref` to avoid redefining value sets (ADR-007: no duplicate defs).
enums:
  status:
    values: [active, deprecated, tombstoned]
    doc: "lifecycle state of any Fact record"
  certainty:
    values: [canon, provisional, contested]
    doc: "how firmly a fact is established in-world"
  rule_kind:
    values: [magic, technology, natural_law, social_law]
    doc: "category of a world-rule element (covers MAG and TEC)"
  relationship_kind:
    values: [familial, romantic, allied, hostile, mentor, subordinate, other]
    doc: "coarse class of a directed relationship edge"
  timeline_kind:
    values: [main, flashback, parallel, hypothetical]
    doc: "role of a time axis"
  importance:
    values: [minor, supporting, major, central]
    doc: "narrative weight"

# The provenance shape required on Derived artifacts (ADR-006 / Reference
# Grammar). Entities themselves are Facts and carry fact_version instead; this
# block is reused by the Derived-wrapper generator in a later phase.
provenance_shape:
  derived_from:
    type: ref[]
    doc: "pinned references (ID@version) this artifact was computed from"
  source_version:
    type: int
    min: 1
    doc: "Registry version the derivation was computed at"
