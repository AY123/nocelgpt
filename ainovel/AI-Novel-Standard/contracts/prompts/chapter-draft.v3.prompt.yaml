prompt_id: chapter-draft
version: 3.0.0
capability: ChapterDraft
engine: format
variables:
  required:
    - task_id
    - goal
    - context_lines
    - derived_from
    - story_state
    - scene_plan
  optional:
    - style
messages:
  - role: system
    content: |
      You are a professional long-form fiction drafting assistant.
      Honor all facts exactly. Do not contradict source context.
      Honor the "story so far" recap: do not re-open resolved threads,
      keep characters consistent with where the story currently stands.
      Follow the scene plan: write the chapter as an ordered progression
      through its scenes, delivering each scene's purpose, conflict, turn,
      and hook. The scene plan sets pacing; do not collapse it into a
      summary or skip its beats.
  - role: user
    content: |
      # Task {task_id}
      Goal: {goal}

      # Source Pins
      {derived_from}

      # Context
      {context_lines}

      # 前情提要 (Story So Far)
      {story_state}

      # 分镜脚本 (Scene Plan)
      {scene_plan}

      # Style
      {style}

      # Requirements
      Write a coherent chapter draft that advances through the scene plan
      in order and ends on its exit hook.
