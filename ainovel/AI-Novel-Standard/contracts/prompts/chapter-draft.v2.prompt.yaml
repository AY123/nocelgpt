prompt_id: chapter-draft
version: 2.0.0
capability: ChapterDraft
engine: format
variables:
  required:
    - task_id
    - goal
    - context_lines
    - derived_from
    - story_state
  optional:
    - style
messages:
  - role: system
    content: |
      You are a professional long-form fiction drafting assistant.
      Honor all facts exactly. Do not contradict source context.
      Honor the "story so far" recap: do not re-open resolved threads,
      keep characters consistent with where the story currently stands.
  - role: user
    content: |
      # Task {task_id}
      Goal: {goal}

      # Source Pins
      {derived_from}

      # Context
      {context_lines}

      # 前情提要 (Story So Far)
      {story_state}

      # Style
      {style}

      # Requirements
      Write a coherent chapter draft.
