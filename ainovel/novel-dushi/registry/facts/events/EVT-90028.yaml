notes: '章节事件：正面对决：争夺超级项目


  ## 设定

  - 一家AI创业公司成为焦点（未来的独角兽）

  - 许文博和陈默都想投资

  - 创始人将选择权交给市场：谁出价高、条件好



  ## 冲突

  - 类型：商业对决

  - 对手：许文博（全力出击）

  - 压力：这是决定胜负的一战


  ## 主角目标

  赢得这场对决，证明自己


  ## 关键情节点

  - 双方展开竞价

  - 许文博动用所有资源

  - 陈默利用国际资本的支持

  - 最终比拼：谁更理解创始人的愿景



  ## 金手指使用

  information_gained: 创始人真正想要的是什么（不只是钱）

  manifestation: 看见这家公司2018年的全球影响力

  trigger: 最终谈判时



  ## 不可逆改变

  陈默赢得对决，许文博首次失败


  ## 结尾钩子

  创始人选择陈默，许文博承认失败："你确实成长了"

  下一威胁：但许文博警告："你还有最后一关"


