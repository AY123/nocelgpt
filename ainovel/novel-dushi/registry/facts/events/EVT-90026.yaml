  information_gained: 通过实地考察和行业分析发现深圳的机遇

  manifestation: 无

  trigger: 无（本章依靠市场调研）



  ## 不可逆改变

  远见资本战略转移，从金融转向科技


  ## 结尾钩子

  业务刚有起色，许文博的人追到深圳："你以为能逃吗？"

  下一威胁：许文博的影响力延伸到深圳


