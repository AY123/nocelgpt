notes: '章节事件：寻找盟友：引入国际资本


  ## 设定

  - 陈默发现：许文博的势力主要在内地

  - 国际资本可以成为制衡力量

  - 准备去香港寻找国际投资人



  ## 冲突

  - 类型：盟友争取

  - 对手：文化差异 + 信任障碍

  - 压力：国际资本对内地创业者有偏见


  ## 主角目标

  说服国际资本，建立联盟


  ## 关键情节点

  - 陈默在香港见到国际基金合伙人

  - 展示远见资本的投资记录

  - 强调中国市场的巨大潜力

  - 用前世的"预判"打动对方



  ## 金手指使用

  information_gained: 基于当前趋势的合理推断，而非绝对预知

  manifestation: 用数据和逻辑分析2013-2020年中国市场的增长潜力

  trigger: 展示市场分析时



  ## 不可逆改变

  远见资本获得国际支持，许文博无法继续封锁


  ## 结尾钩子

  国际资本同意合作，但许文博得知后说："那就来场真正的较量"

  下一威胁：许文博准备正面对决


  ## 退出状态

