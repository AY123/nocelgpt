notes: '章节事件：新的对手：周江登场


  ## 设定

  - 周江是金融圈大佬，管理数十亿资金

  - 周子铭只是周江的一颗棋子

  - 周江对陈默很感兴趣："能扳倒子铭的人，有资格和我谈"



  ## 冲突

  - 类型：实力碾压

  - 对手：周江（阶段boss）

  - 压力：周江掌控整个江城金融圈，陈默毫无胜算


  ## 主角目标

  在周江面前证明自己的价值，争取生存空间


  ## 关键情节点

  - 周江展示自己的实力和人脉

  - 陈默用前世记忆展现"预判能力"

  - 周江提出交易：陈默为他工作，或者滚出江城

  - 陈默拒绝，但提出合作而非雇佣



  ## 金手指使用

  information_gained: 周江的弱点和盲区

  manifestation: 回忆起周江前世的一次重大失败（2014年的一笔错误投资）

  trigger: 谈判关键时刻



  ## 不可逆改变

  陈默与周江建立对抗关系


  ## 结尾钩子

  周江冷笑："我给你三个月时间，证明你不是在吹牛"

  下一威胁：三个月内必须拿出成绩，否则被周江碾压


  ## 退出状态

  open_threads:

  - 如何在三个月内证明自己

  - 第一笔投资必须成功

  - 周江会如何试探

  protagonist_location: 远见资本

  protagonist_status: 面临三个月考验期

  time_pressure: 90天'
