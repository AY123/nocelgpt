notes: '章节事件：更大的项目：参与内幕交易


  ## 设定

  - 周子铭透露：恒泰地产即将进行一笔大交易

  - 陈默被要求提供"市场分析"

  - 陈默意识到：这是一笔内幕交易



  ## 冲突

  - 类型：道德困境

  - 对手：周子铭（逼迫） + 自己的良知

  - 压力：参与则违法，拒绝则失去周子铭信任


  ## 主角目标

  既不违法，又不彻底得罪周子铭


  ## 关键情节点

  - 周子铭展示交易细节

  - 陈默发现这笔交易在前世导致多人破产

  - 陈默假装同意，但暗中计划破坏

  - 林志远警告：这是陷阱



  ## 金手指使用

  information_gained: 交易的致命漏洞

  manifestation: 清晰看见前世这笔交易的灾难性后果

  trigger: 看到交易方案时



  ## 不可逆改变

  陈默决定暗中破坏，与周子铭彻底对立


  ## 结尾钩子

  陈默暗中联系苏晴，准备曝光内幕交易

  下一威胁：一旦行动，周子铭会报复


  ## 退出状态

