notes: '章节事件：寻找超级项目：瞄准移动互联网


  ## 设定

  - 2013年是移动互联网爆发前夜

  - 陈默锁定目标：一家即将改变世界的公司

  - 但竞争激烈，巨头们都在抢



  ## 冲突

  - 类型：资源竞争

  - 对手：顶级投资机构

  - 压力：远见资本规模太小，难以竞争


  ## 主角目标

  找到差异化优势，拿到投资份额


  ## 关键情节点

  - 陈默研究多个移动互联网项目

  - 锁定目标：一家社交软件公司（影射某知名应用）

  - 发现巨头们都在抢，竞争白热化

  - 陈默决定：用前世记忆找到创始人的真实诉求



  ## 金手指使用

  information_gained: 公司未来的发展轨迹

  manifestation: 看见这家公司2015年的估值（百亿美元）

  trigger: 分析项目时



  ## 不可逆改变

  陈默锁定目标，全力以赴


  ## 结尾钩子

  创始人同意见面，但提出条件："我只见真正懂我的人"

  下一威胁：如何打动创始人


  ## 退出状态

  open_threads:

  - 如何打动创始人

  - 巨头们会如何反应

  - 许文博在观察

