notes: '章节事件：第一笔投资：押注未来独角兽


  ## 设定

  - 陈默锁定目标：一家名为"云图科技"的创业公司

  - 前世这家公司在2015年成为独角兽

  - 但现在没人看好，估值极低



  ## 冲突

  - 类型：信任危机

  - 对手：林志远（质疑） + 市场共识

  - 压力：所有人都认为这笔投资会失败


  ## 主角目标

  说服团队，完成第一笔投资


  ## 关键情节点

  - 陈默展示云图科技的潜力分析

  - 林志远从风控角度反对

  - 苏晴调查后发现：创始人确实有实力

  - 陈默说服团队，投入全部资金



  ## 金手指使用

  information_gained: 关键技术突破的时间点

  manifestation: 看见云图科技2015年的上市路演画面

  trigger: 尽职调查时



  ## 不可逆改变

  远见资本押注云图科技，背水一战


  ## 结尾钩子

  投资完成，但周江派人警告："你最好别失败"

  下一威胁：如果投资失败，周江会吞并远见资本


  ## 退出状态

