# ============================================================
# 金手指规则（不可变更）
# ============================================================

golden_finger:
  type: 前世记忆
  name: 17年完整记忆

  scope:
    - 知道2013-2030年的重大商机
    - 知道2013-2030年的金融危机
    - 知道重要人物的命运轨迹

  limits:
    - 不能直接预知具体股票涨跌细节（只知道大趋势）
    - 只记得大事件和关键人物
    - 细节可能因记忆模糊而不准确
    - 改变历史会产生蝴蝶效应

  cost:
    primary: 改变历史轨迹可能导致蝴蝶效应
    secondary: 熟悉的人和事会发生变化
    tertiary: 前世珍视的未来可能永远不会到来

  activation_condition: 生死一线或极端压力下

  manifestation:
    - 突然涌现的清晰画面
    - 比普通回忆更详细的"记忆碎片"
    - 看见未来事件的具体细节

# ============================================================
# 前30章主线事件（具体事件，不是抽象目标）
# ============================================================

chapter_events:
  - chapter: 1
    date: "2013-01-15"
    location: 恒远投资公司
    title: 身份落差暴露，金手指在绝境中被逼显性化

    setup:
      - 陈默面临30万违约金，只有72小时
      - 银行卡余额4200元
      - 重生三个月，第一步就失败了

    conflict:
      type: 眼前的生存威胁
      antagonist: 赵鹏程（盛达咨询法务总监）
      pressure: 72小时内必须解决，否则法院强制执行

    protagonist_goal: 避免重蹈前世覆辙，用另一种方式解决

    key_beats:
      - 赵鹏程提供"灰色项目"陷阱
      - 陈默决定直接见周子铭（恒泰地产副总裁）
      - 陈默用前世记忆整理的"证据"作为筹码
      - 陈默赌周子铭会妥协

    golden_finger_use:
      trigger: 极端压力下
      manifestation: 突然看见2013年6月18日周子铭被捕的清晰画面
      information_gained: 周子铭财务造假的部分细节
      cost_paid: 画面中出现前世不存在的"三人死亡交通事故"新闻

    irreversible_change: 陈默主动介入周子铭案件，改变了历史轨迹

    end_hook:
      content: 周子铭短信：明天晚上八点，云顶会所
      next_threat: 谈判失败可能被灭口

    exit_state:
      protagonist_location: 恒远投资公司
      protagonist_status: 暂时安全，等待谈判
      time_pressure: 71小时52分钟
      open_threads:
        - 与周子铭的谈判
        - 30万违约金尚未解决
        - 蝴蝶效应已经开始

