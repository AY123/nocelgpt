story_phases:
  - phase: 1
    name: 实习生月入三千阶段
    chapters: 1-10
    antagonist: 赵鹏程等小敌人
    protagonist_goal: 生存与脱困
    power_level: 底层
    key_milestone: 解决违约金危机，脱离周子铭控制

  - phase: 2
    name: 操盘手年入百万阶段
    chapters: 11-20
    antagonist: 周江（阶段boss）
    protagonist_goal: 建立自己的事业
    power_level: 中层
    key_milestone: 与周江正面对抗，建立投资公司

  - phase: 3
    name: 资本家阶段
    chapters: 21-30
    antagonist: 行业巨头
    protagonist_goal: 成为行业领袖
    power_level: 高层
    key_milestone: 改写前世失败命运，实现商业帝国

# ============================================================
# 叙事规则（所有章节必须遵守）
# ============================================================

narrative_rules:
  protagonist_name_rule:
    description: 主角名字永远是"陈默"，不得出现其他名字
    enforcement: 确定性检查

  time_progression_rule:
    description: 时间只能前进，不能倒流
    enforcement: 确定性检查

  location_consistency_rule:
    description: 地点必须在已授权列表中，或合理扩展
    enforcement: 确定性检查

  character_consistency_rule:
    description: 已出场人物不能凭空消失或改名
    enforcement: 确定性检查

  golden_finger_rule:
    description: 金手指使用必须有代价，不能无限使用
    enforcement: 人工审核

  causality_rule:
    description: 本章开头必须承接上章结尾的钩子
    enforcement: 语义审查

  butterfly_effect_rule:
    description: 改变历史必须有后果，不能改变后一切照旧
    enforcement: 人工审核

