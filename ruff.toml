# Ruff configuration for ANovelOS V2
# Version: 1.0.0

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment (functional code style)
    "B023",  # loop variable binding (acceptable in generators)
    "E402",  # module import position (some legacy scripts)
    "B905",  # zip strict parameter (Python 3.10+)
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
