[project]
name = "anovelos"
version = "0.1.0"
description = "ANovelOS V2 repository bootstrap"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = ["SQLAlchemy==2.0.54", "psycopg[binary]==3.3.6"]

[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
    "ruff==0.16.9",
    "mypy==1.20.2",
    "types-PyYAML>=6,<7",
    "pip-audit==2.10.1",
]

[tool.uv]
required-version = "==0.12.17"
default-groups = ["dev"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.build-backend]
module-name = "anovel"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
