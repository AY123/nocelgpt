name: V2-004 mandatory gates
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: v2-004-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gates:
    runs-on: ubuntu-24.04
    container: python:3.12.14-bookworm
    timeout-minutes: 20
    continue-on-error: false
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - gate: static
          label: STATIC
        - gate: schema_contract
          label: SCHEMA_CONTRACT
        - gate: unit
          label: UNIT
        - gate: arch_fitness
          label: ARCH_FITNESS
        - gate: secret_dependency
          label: SECRET_DEPENDENCY
    env:
      ANOVELOS_GATE_NAME: ${{ matrix.gate }}
    steps:
    - name: Checkout exact revision and complete history
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Verify GitHub source context
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python -I -B scripts/ci/github_context.py
    - name: Install locked runtime
      run: 'python -m pip install --index-url https://pypi.org/simple uv==0.12.17

        uv sync --locked'
    - name: Run mandatory gate
      run: uv run --locked python -B scripts/ci/run_gate.py ${{ matrix.gate }}
    - name: Upload original receipts and reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/ci/${{ matrix.gate }}/
        if-no-files-found: error
        retention-days: 14
  postgres_env:
    runs-on: ubuntu-24.04
    container: python:3.12.14-bookworm
    timeout-minutes: 20
    continue-on-error: false
    name: POSTGRES_ENV
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_USER: anovel
          POSTGRES_PASSWORD: anovel_test
          POSTGRES_DB: bootstrap_test
        options: --health-cmd "pg_isready -U anovel -d bootstrap_test" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      ANOVELOS_GATE_NAME: postgres_env
      ANOVELOS_TEST_DSN: postgresql+psycopg://anovel:anovel_test@postgres:5432/bootstrap_test
    steps:
    - name: Checkout exact revision and complete history
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Verify GitHub source context
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python -I -B scripts/ci/github_context.py
    - name: Install locked runtime
      run: 'python -m pip install --index-url https://pypi.org/simple uv==0.12.17

        uv sync --locked'
    - name: Run mandatory gate
      run: uv run --locked python -B scripts/ci/run_gate.py postgres_env
    - name: Upload original receipts and reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-postgres_env-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/ci/postgres_env/
        if-no-files-found: error
        retention-days: 14
